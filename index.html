<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>爆旋陀螺 X AI 專業對戰教練 | Beyblade X Battle Coach</title>
  <style>
    :root {
      --bg-color: #0a0e17;
      --card-bg: rgba(18, 25, 41, 0.85);
      --card-border: rgba(0, 240, 255, 0.25);
      --primary-cyan: #00f0ff;
      --accent-gold: #ffd700;
      --neon-red: #ff0055;
      --neon-green: #00ff88;
      --text-main: #f0f4f8;
      --text-muted: #8a99ad;
      --font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      background-image: 
        radial-gradient(circle at 10% 10%, rgba(0, 240, 255, 0.08) 0%, transparent 40%),
        radial-gradient(circle at 90% 90%, rgba(255, 0, 85, 0.08) 0%, transparent 40%);
      color: var(--text-main);
      font-family: var(--font-family);
      min-height: 100vh;
      padding: 16px;
      display: flex;
      justify-content: center;
    }

    .app-container {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* Header Styling */
    header {
      text-align: center;
      padding: 20px 10px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.15);
      backdrop-filter: blur(10px);
      position: relative;
      overflow: hidden;
    }

    header::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
      background: linear-gradient(90deg, var(--primary-cyan), var(--accent-gold), var(--neon-red));
    }

    .logo-badge {
      display: inline-block;
      font-size: 0.8rem;
      font-weight: 800;
      color: var(--accent-gold);
      background: rgba(255, 215, 0, 0.1);
      border: 1px solid var(--accent-gold);
      padding: 4px 12px;
      border-radius: 20px;
      letter-spacing: 1.5px;
      margin-bottom: 8px;
    }

    h1 {
      font-size: 1.8rem;
      color: #fff;
      text-shadow: 0 0 10px rgba(0, 240, 255, 0.5);
      letter-spacing: 1px;
    }

    .subtitle {
      font-size: 0.9rem;
      color: var(--text-muted);
      margin-top: 6px;
    }

    /* Search Box & Suggestions */
    .search-section {
      position: relative;
    }

    .search-box-wrapper {
      display: flex;
      gap: 10px;
    }

    .search-input-container {
      position: relative;
      flex: 1;
    }

    input[type="text"] {
      width: 100%;
      padding: 14px 18px;
      background: rgba(10, 14, 23, 0.9);
      border: 1.5px solid var(--card-border);
      border-radius: 12px;
      color: #fff;
      font-size: 1rem;
      outline: none;
      transition: all 0.3s ease;
    }

    input[type="text"]:focus {
      border-color: var(--primary-cyan);
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
    }

    .search-btn {
      padding: 0 24px;
      background: linear-gradient(135deg, var(--primary-cyan), #0088cc);
      border: none;
      border-radius: 12px;
      color: #000;
      font-weight: bold;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.2s ease;
      box-shadow: 0 0 10px rgba(0, 240, 255, 0.3);
    }

    .search-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 0 20px rgba(0, 240, 255, 0.6);
    }

    /* Auto Suggestion Dropdown */
    .suggestions-dropdown {
      position: absolute;
      top: 105%;
      left: 0;
      right: 0;
      background: #0f172a;
      border: 1px solid var(--primary-cyan);
      border-radius: 12px;
      max-height: 260px;
      overflow-y: auto;
      z-index: 100;
      box-shadow: 0 10px 25px rgba(0,0,0,0.8);
      display: none;
    }

    .suggestion-item {
      padding: 12px 16px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255,255,255,0.05);
      transition: background 0.2s;
    }

    .suggestion-item:hover {
      background: rgba(0, 240, 255, 0.15);
    }

    .suggestion-code {
      color: var(--accent-gold);
      font-weight: bold;
      font-size: 0.85rem;
    }

    /* Preset Buttons */
    .presets-container {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .preset-label {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-right: 4px;
    }

    .preset-chip {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: var(--text-main);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .preset-chip:hover {
      background: rgba(0, 240, 255, 0.2);
      border-color: var(--primary-cyan);
      color: #fff;
    }

    /* Deck Set View (3對戰套裝) */
    .deck-banner {
      background: linear-gradient(135deg, rgba(255, 215, 0, 0.15), rgba(255, 0, 85, 0.15));
      border: 1px solid var(--accent-gold);
      border-radius: 16px;
      padding: 20px;
      margin-top: 10px;
    }

    .deck-title {
      font-size: 1.3rem;
      color: var(--accent-gold);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .deck-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 16px;
      margin-top: 16px;
    }

    .deck-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s;
    }

    .deck-card:hover {
      transform: translateY(-4px);
      border-color: var(--primary-cyan);
    }

    .deck-bey-name {
      font-weight: bold;
      font-size: 1.1rem;
      color: #fff;
      margin-bottom: 8px;
    }

    .deck-analyze-btn {
      margin-top: 12px;
      padding: 8px;
      background: rgba(0, 240, 255, 0.15);
      border: 1px solid var(--primary-cyan);
      color: var(--primary-cyan);
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      text-align: center;
      transition: all 0.2s;
    }

    .deck-analyze-btn:hover {
      background: var(--primary-cyan);
      color: #000;
    }

    /* Analysis Dashboard */
    .analysis-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 24px;
      backdrop-filter: blur(10px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
    }

    .bey-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 16px;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .bey-title-group h2 {
      font-size: 1.6rem;
      color: #fff;
    }

    .bey-code-badge {
      display: inline-block;
      font-size: 0.85rem;
      background: var(--primary-cyan);
      color: #000;
      font-weight: bold;
      padding: 2px 8px;
      border-radius: 4px;
      margin-bottom: 6px;
    }

    .specs-pills {
      display: flex;
      gap: 10px;
    }

    .pill {
      background: rgba(255,255,255,0.08);
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      border: 1px solid rgba(255,255,255,0.1);
    }

    .pill span {
      color: var(--accent-gold);
      font-weight: bold;
    }

    /* Parts Grid */
    .section-title {
      font-size: 1.1rem;
      color: var(--primary-cyan);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
      letter-spacing: 0.5px;
    }

    .parts-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .part-box {
      background: rgba(10, 14, 23, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-left: 3px solid var(--primary-cyan);
      border-radius: 10px;
      padding: 14px;
    }

    .part-type {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .part-name {
      font-size: 1.1rem;
      font-weight: bold;
      color: #fff;
      margin: 4px 0 8px 0;
    }

    .part-detail {
      font-size: 0.85rem;
      color: #cbd5e1;
      line-height: 1.4;
    }

    /* Pros & Cons Section */
    .pros-cons-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 16px;
      margin-bottom: 24px;
    }

    .pro-box, .con-box {
      background: rgba(10, 14, 23, 0.6);
      border-radius: 12px;
      padding: 16px;
    }

    .pro-box { border: 1px solid rgba(0, 255, 136, 0.3); }
    .con-box { border: 1px solid rgba(255, 0, 85, 0.3); }

    .pro-box .section-title { color: var(--neon-green); }
    .con-box .section-title { color: var(--neon-red); }

    .feature-list {
      list-style: none;
      font-size: 0.9rem;
    }

    .feature-list li {
      margin-bottom: 8px;
      position: relative;
      padding-left: 20px;
      line-height: 1.4;
    }

    .pro-box li::before { content: '✔'; position: absolute; left: 0; color: var(--neon-green); }
    .con-box li::before { content: '✖'; position: absolute; left: 0; color: var(--neon-red); }

    /* Tactical Advice Section */
    .tactics-box {
      background: linear-gradient(135deg, rgba(0, 240, 255, 0.08), rgba(10, 14, 23, 0.9));
      border: 1px solid var(--primary-cyan);
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 24px;
    }

    .tactics-meta {
      display: flex;
      gap: 16px;
      margin-top: 12px;
      flex-wrap: wrap;
    }

    .tactic-tag {
      background: rgba(0, 240, 255, 0.15);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.85rem;
      color: #fff;
      border: 1px solid rgba(0, 240, 255, 0.4);
    }

    /* Counter Combos */
    .counter-box {
      background: rgba(10, 14, 23, 0.6);
      border: 1px solid rgba(255, 215, 0, 0.3);
      border-radius: 12px;
      padding: 18px;
      margin-bottom: 24px;
    }

    .counter-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 12px;
    }

    .counter-item {
      background: rgba(255, 255, 255, 0.04);
      padding: 10px 14px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.9rem;
    }

    .counter-item-name {
      font-weight: bold;
      color: var(--accent-gold);
    }

    /* BeyDB Citation Banner */
    .beydb-cite-card {
      background: rgba(0, 240, 255, 0.05);
      border: 1px dashed var(--primary-cyan);
      border-radius: 12px;
      padding: 16px;
      text-align: center;
      margin-top: 20px;
    }

    .beydb-cite-card p {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 10px;
    }

    .beydb-btn {
      display: inline-block;
      padding: 8px 20px;
      background: var(--primary-cyan);
      color: #000;
      font-weight: bold;
      text-decoration: none;
      border-radius: 8px;
      font-size: 0.85rem;
      transition: all 0.2s;
    }

    .beydb-btn:hover {
      background: #fff;
      box-shadow: 0 0 15px var(--primary-cyan);
    }

    /* Fallback / Not Found View */
    .not-found-card {
      text-align: center;
      padding: 40px 20px;
      background: var(--card-bg);
      border: 1px solid rgba(255,0,85,0.4);
      border-radius: 16px;
    }

    .not-found-card h3 {
      color: var(--neon-red);
      margin-bottom: 10px;
    }

    /* Responsive Adjustments */
    @media (max-width: 600px) {
      h1 { font-size: 1.4rem; }
      .search-box-wrapper { flex-direction: column; }
      .search-btn { padding: 12px; }
      .bey-header { flex-direction: column; gap: 8px; }
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Header -->
    <header>
      <div class="logo-badge">BEYBLADE X AI COACH</div>
      <h1>爆旋陀螺 X 專業對戰教練</h1>
      <p class="subtitle">數據源自 Hinfok BeyDB 權威資料庫，提供即時組件拆解與戰術解析</p>
    </header>

    <!-- Search Section -->
    <div class="search-section">
      <div class="search-box-wrapper">
        <div class="search-input-container">
          <input 
            type="text" 
            id="searchInput" 
            placeholder="輸入產品編號 (例如 UX-15, BX-35, BX-23) 或陀螺名稱 (如 黑龜, Wizard Rod)..."
            autocomplete="off"
          />
          <div id="suggestions" class="suggestions-dropdown"></div>
        </div>
        <button class="search-btn" onclick="handleSearch()">AI 分析</button>
      </div>
    </div>

    <!-- Preset Shortcuts -->
    <div class="presets-container">
      <span class="preset-label">熱門推薦:</span>
      <button class="preset-chip" onclick="quickSelect('UX-15')">🔥 UX-15 (3對戰套裝)</button>
      <button class="preset-chip" onclick="quickSelect('BX-35')">🐢 BX-35 (Black Shell 黑龜)</button>
      <button class="preset-chip" onclick="quickSelect('UX-03')">Wizard Rod (UX-03)</button>
      <button class="preset-chip" onclick="quickSelect('BX-23')">鳳凰翼 (BX-23)</button>
      <button class="preset-chip" onclick="quickSelect('UX-01')">Dran Buster (UX-01)</button>
    </div>

    <!-- Main Output Area -->
    <main id="outputContainer">
      <!-- Content populated dynamically by JS -->
    </main>

    <!-- Footer -->
    <footer style="text-align: center; font-size: 0.8rem; color: var(--text-muted); padding: 10px;">
      本工具核心數據嚴格參照 <a href="https://beys.hinfok.com/" target="_blank" style="color: var(--primary-cyan); text-decoration: none;">Hinfok BeyDB</a> 官方標準數據。
    </footer>
  </div>

  <script>
    /* ==========================================================================
       1. Embedded Database (Hinfok BeyDB Ref. Specs)
       ========================================================================== */
    const BEY_DB = {
      blades: {
        "black shell": { name: "黑龜 (Black Shell)", code: "BX-35", weight: "32.4g", spin: "右迴旋 (Right)", desc: "圓滑下勾防禦型金屬刃，防禦角度極佳，能顯著減緩正面猛烈撞擊力。" },

        "b": { name: "B (Ball)", type: "持久型", dash: "C級", stamina: "S級", desc: "球形軸心，減少地面摩擦，受到撞擊後能迅速回復中心。" }

      sets: {
        "UX-15": {
          code: "UX-15",
          name: "UX-15 3對戰套裝 (Deck Set)",
          desc: "包含 3 款全新 UX 強化系列陀螺，具備超低重心與獨特鋸齒配重設計。",
          beys: [
            { name: "Shark Scale 4-50UF", blade: "shark scale", ratchet: "4-50", bit: "uf" },
            { name: "Tyranno Roar 1-70L", blade: "tyranno roar", ratchet: "1-70", bit: "l" },
            { name: "Hells Brave 3-60GF", blade: "hells brave", ratchet: "3-60", bit: "gf" }
          ]

      },
      combos: {
        "BX-35": { name: "Black Shell 4-60D (黑龜)", blade: "black shell", ratchet: "4-60", bit: "d", code: "BX-35" },
        "UX-03": { name: "Wizard Rod 5-70DB", blade: "wizard rod", ratchet: "9-60", bit: "db", code: "UX-03" },
        "BX-23": { name: "Phoenix Wing 9-60GF", blade: "phoenix wing", ratchet: "9-60", bit: "gf", code: "BX-23" },
        "UX-01": { name: "Dran Buster 1-60A", blade: "dran buster", ratchet: "1-60", bit: "a", code: "UX-01" },
        "BX-34": { name: "Cobalt Dragoon 2-60C", blade: "cobalt dragoon", ratchet: "1-60", bit: "gf", code: "BX-34" }
      }
    };

    /* Helper Function: Normalize Strings (Removes spaces, hyphens, lowercase) */
    function norm(str) {
      if (!str) return '';
      return str.toString().toLowerCase().replace(/[-\s]/g, '');
    }

    /* ==========================================================================
       2. Search Suggestions & Auto Complete
       ========================================================================== */
    const searchInput = document.getElementById('searchInput');
    const suggestionsBox = document.getElementById('suggestions');

    searchInput.addEventListener('input', function() {
      const q = norm(this.value);
      if (!q) {
        suggestionsBox.style.display = 'none';
        return;
      }

      let matches = [];

      // Check Sets
      Object.keys(BEY_DB.sets).forEach(key => {
        if (norm(key).includes(q) || norm(BEY_DB.sets[key].name).includes(q)) {
          matches.push({ title: BEY_DB.sets[key].name, code: key, type: '3對戰套裝' });
        }
      });

      // Check Combos / Products (e.g., BX-35, UX-03)
      Object.keys(BEY_DB.combos).forEach(key => {
        if (norm(key).includes(q) || norm(BEY_DB.combos[key].name).includes(q)) {
          matches.push({ title: BEY_DB.combos[key].name, code: key, type: '單體陀螺' });
        }
      });

      // Check Blades (e.g. 黑龜, 鳳凰翼)
      Object.keys(BEY_DB.blades).forEach(key => {
        const blade = BEY_DB.blades[key];
        if (norm(key).includes(q) || norm(blade.name).includes(q) || norm(blade.code).includes(q)) {
          matches.push({ title: blade.name, code: blade.code || key, type: 'Blade 部件' });
        }
      });

      // Filter unique
      const uniqueMatches = Array.from(new Set(matches.map(a => a.title)))
        .map(title => matches.find(a => a.title === title)).slice(0, 6);

      if (uniqueMatches.length > 0) {
        suggestionsBox.innerHTML = uniqueMatches.map(m => `
          <div class="suggestion-item" onclick="selectSuggestion('${m.code}')">
            <span>${m.title}</span>
            <span class="suggestion-code">${m.type}</span>
          </div>
        `).join('');
        suggestionsBox.style.display = 'block';
      } else {
        suggestionsBox.style.display = 'none';
      }
    });

    function selectSuggestion(code) {
      searchInput.value = code;
      suggestionsBox.style.display = 'none';
      handleSearch();
    }

    function quickSelect(code) {
      searchInput.value = code;
      handleSearch();
    }

    document.addEventListener('click', function(e) {
      if (!e.target.closest('.search-input-container')) {
        suggestionsBox.style.display = 'none';
      }
    });

    /* ==========================================================================
       3. Main Search Engine with Flexible Normalization
       ========================================================================== */
    function handleSearch() {
      const q = norm(searchInput.value);
      suggestionsBox.style.display = 'none';

      if (!q) return;

      // 1. Search Sets (e.g. UX-15)
      for (let key in BEY_DB.sets) {
        if (norm(key).includes(q) || q.includes(norm(key)) || norm(BEY_DB.sets[key].name).includes(q)) {
          renderDeckSetView(BEY_DB.sets[key]);
          return;
        }
      }

      // 2. Search Combos / Standard Product Codes (e.g. BX-35, UX-03, BX-23)
      for (let key in BEY_DB.combos) {
        if (norm(key).includes(q) || q.includes(norm(key)) || norm(BEY_DB.combos[key].name).includes(q)) {
          const combo = BEY_DB.combos[key];
          renderSingleBeyAnalysis(combo.blade, combo.ratchet, combo.bit, combo.name, combo.code);
          return;
        }
      }

      // 3. Search Individual Blades (e.g. "黑龜", "Black Shell", "鳳凰翼")
      for (let key in BEY_DB.blades) {
        const bladeObj = BEY_DB.blades[key];
        if (norm(key).includes(q) || norm(bladeObj.name).includes(q) || norm(bladeObj.code).includes(q)) {
          renderSingleBeyAnalysis(key, "4-60", "d", `${bladeObj.name} 分析`, bladeObj.code || "BX/UX");
          return;
        }
      }

      // 4. Fallback Not Found
      renderNotFound();
    }

    /* ==========================================================================
       4. UI Rendering Functions
       ========================================================================== */

    // Render 3對戰套裝 (Deck Set Mode)
    function renderDeckSetView(setObj) {
      const output = document.getElementById('outputContainer');
      output.innerHTML = `
        <div class="deck-banner">
          <div class="deck-title">
            <span>🛡️</span>
            <span>【3對戰套裝辨識】${setObj.name}</span>
          </div>
          <p style="font-size: 0.9rem; color: #cbd5e1;">${setObj.desc}</p>
          
          <div class="deck-grid">
            ${setObj.beys.map((bey, idx) => `
              <div class="deck-card">
                <div>
                  <span class="bey-code-badge">Slot 0${idx + 1}</span>
                  <div class="deck-bey-name">${bey.name}</div>
                  <p style="font-size: 0.8rem; color: var(--text-muted);">
                    Blade: ${BEY_DB.blades[bey.blade]?.name || bey.blade}<br>
                    Ratchet: ${bey.ratchet} | Bit: ${bey.bit.toUpperCase()}
                  </p>
                </div>
                <button class="deck-analyze-btn" onclick="renderSingleBeyAnalysis('${bey.blade}', '${bey.ratchet}', '${bey.bit}', '${bey.name}', '${setObj.code}')">
                  🔍 單體 AI 深度分析
                </button>
              </div>
            `).join('')}
          </div>
        </div>
      `;
    }

    // Render Single Bey Analysis
    function renderSingleBeyAnalysis(bladeKey, ratchetKey, bitKey, customTitle = "", productCode = "BX/UX") {
      const blade = BEY_DB.blades[bladeKey] || BEY_DB.blades["black shell"];
      const ratchet = BEY_DB.ratchets[ratchetKey] || BEY_DB.ratchets["4-60"];
      const bit = BEY_DB.bits[bitKey] || BEY_DB.bits["d"];

      const title = customTitle || `${blade.name} ${ratchet.name} ${bit.name.split(' ')[0]}`;

      // AI Logic
      const isAttack = bit.type.includes("攻擊");
      const isDefense = bit.type.includes("防禦");

      const pros = [];
      const cons = [];

      if (isDefense) {
        pros.push("圓滑低阻力 Blade 與重腰身棘輪，能有效吸收外場猛烈衝撞。");
        pros.push(`搭配 ${bit.name} 軸心，受撞擊後傾斜角度能快速彈回戰鬥盤中心。`);
        cons.push("面對頂級持久型 (如 Wizard Rod DB) 於戰局後段轉速表現略遜一籌。");
        cons.push("反擊爆發力較弱，主要依賴減震防守贏得點數。");
      } else if (isAttack) {
        pros.push("具備極速 X-Dash 衝刺能力，首波外場 KO (Over Finish) 率高。");
        pros.push(`配合 ${blade.name.split(' ')[0]} 的重型金屬刃，撞擊爆發力極高。`);
        cons.push("戰局中後期持久力衰減極快。");
      } else {
        pros.push("戰術性能極度穩定，抗打擊與持久力均衡。");
        cons.push("無特別突出爆發一擊能力。");
      }

      const output = document.getElementById('outputContainer');
      output.innerHTML = `
        <div class="analysis-card">
          <!-- Header -->
          <div class="bey-header">
            <div class="bey-title-group">
              <span class="bey-code-badge">官方編號/套裝: ${productCode}</span>
              <h2>${title}</h2>
            </div>
            <div class="specs-pills">
              <div class="pill">預估總重: <span>~${(parseFloat(blade.weight) + 6.2 + 2.1).toFixed(1)}g</span></div>
              <div class="pill">迴旋方向: <span>${blade.spin}</span></div>
            </div>
          </div>

          <!-- Section 1: Parts Disassembly -->
          <div class="section-title">⚡ 1. 配件拆解與規格 (Hinfok BeyDB 數據參照)</div>
          <div class="parts-grid">
            <div class="part-box">
              <div class="part-type">Blade (攻擊環/刃)</div>
              <div class="part-name">${blade.name}</div>
              <div class="part-detail">
                重量: <b>${blade.weight}</b> | 迴旋: <b>${blade.spin}</b><br>
                ${blade.desc}
              </div>
            </div>

            <div class="part-box">
              <div class="part-type">Ratchet (棘輪/中軸)</div>
              <div class="part-name">${ratchet.name}</div>
              <div class="part-detail">
                高度: <b>${ratchet.height}</b> | 齒數: <b>${ratchet.teeth}</b><br>
                爆裂風險: <b style="color:var(--neon-green)">${ratchet.burstRisk}</b><br>
                ${ratchet.desc}
              </div>
            </div>

            <div class="part-box">
              <div class="part-type">Bit (軸心)</div>
              <div class="part-name">${bit.name}</div>
              <div class="part-detail">
                類型: <b>${bit.type}</b><br>
                X-Dash衝刺: <b>${bit.dash}</b> | 持久力: <b>${bit.stamina}</b><br>
                ${bit.desc}
              </div>
            </div>
          </div>

          <!-- Section 2: Pros & Cons -->
          <div class="pros-cons-grid">
            <div class="pro-box">
              <div class="section-title">🟢 核心優勢 (Pros)</div>
              <ul class="feature-list">
                ${pros.map(p => `<li>${p}</li>`).join('')}
              </ul>
            </div>

            <div class="con-box">
              <div class="section-title">🔴 核心劣勢與弱點 (Cons)</div>
              <ul class="feature-list">
                ${cons.map(c => `<li>${c}</li>`).join('')}
              </ul>
            </div>
          </div>

          <!-- Section 3: Launch Tactics -->
          <div class="tactics-box">
            <div class="section-title">🎯 2. AI 發射戰術建議 (Launch Tactics)</div>
            <p style="font-size: 0.95rem; line-height: 1.5; color: #e2e8f0;">
              ${isDefense 
                ? '建議採用 <b>0° 絕對垂直穩定發射</b>，力道維持在 <b>85%~90%</b>。發射落點選擇戰鬥盤中央，讓 D (Dot) 軸心迅速著地定點，發揮下勾角度吸收首波強力衝刺。' 
                : '建議採用 <b>15° 傾斜角度發射</b>，配合拉線爆發力衝刺。'}
            </p>
            <div class="tactics-meta">
              <div class="tactic-tag">建議力道: <b>${isDefense ? '85% 穩定控制' : '100% 強力拉線'}</b></div>
              <div class="tactic-tag">發射角度: <b>${isDefense ? '90° 垂直落點' : '15° 傾斜切入'}</b></div>
            </div>
          </div>

          <!-- Section 4: Counter Combos -->
          <div class="counter-box">
            <div class="section-title">⚔️ 3. 克制組合推薦 (Counter Combos)</div>
            <div class="counter-list">
              <div class="counter-item">
                <div>
                  <span class="counter-item-name">Wizard Rod 9-60 DB</span>
                  <span style="font-size:0.8rem; color:var(--text-muted);"> (頂級持久抗衡)</span>
                </div>
                <span style="color:var(--neon-green); font-size:0.85rem; font-weight:bold;">勝率預估 62%</span>
              </div>
            </div>
          </div>

          <!-- Hinfok BeyDB Citation -->
          <div class="beydb-cite-card">
            <p>數據與組件拆解嚴格參照 Hinfok BeyDB 官方數據庫庫存紀錄。</p>
            <a href="https://beys.hinfok.com/" target="_blank" class="beydb-btn">
              🌐 前往 Hinfok BeyDB 官網查看完整原廠數據
            </a>
          </div>
        </div>
      `;
    }

    // Render Friendly Fallback Error
    function renderNotFound() {
      const output = document.getElementById('outputContainer');
      output.innerHTML = `
        <div class="not-found-card">
          <h3>⚠️ 未找到匹配的陀螺或部件數據</h3>
          <p style="color: var(--text-muted); font-size: 0.9rem; margin-bottom: 16px;">
            請嘗試輸入標準編號（如 UX-15, BX-35, UX-03）或熱門名稱（如 黑龜, 鳳凰翼, Wizard Rod）。
          </p>
          <div class="beydb-cite-card" style="max-width: 400px; margin: 0 auto;">
            <p>找不到想要的資料？直接前往 Hinfok BeyDB 尋找最新陀螺數據：</p>
            <a href="https://beys.hinfok.com/" target="_blank" class="beydb-btn">
              🔗 開啟 Hinfok BeyDB 資料庫
            </a>
          </div>
        </div>
      `;
    }

    // Default view on load
    window.addEventListener('DOMContentLoaded', () => {
      quickSelect('BX-35');
    });
  </script>
</body>
</html>
